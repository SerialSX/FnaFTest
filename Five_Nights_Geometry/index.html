<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Five Nights at Geometry</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/menu.css">
    <link rel="stylesheet" href="css/game.css">
    <link rel="stylesheet" href="css/terminal.css">
</head>
<body>

    <!-- TELA DE MENU -->
    <div id="menu-screen" class="screen active">
        <div class="static-overlay"></div>
        <h1 class="game-title">Five Nights at<br>Geometry</h1>
        <div class="menu-options">
            <button id="btn-new-game" class="menu-btn">New Game</button>
            <button id="btn-continue" class="menu-btn">Continue</button>
        </div>
        <p class="copyright">© 2026 Arthur</p>
    </div>

    <!-- TELA DO JOGO (Escritório) -->
    <div id="game-screen" class="screen hidden">
        
        <!-- O ambiente físico do escritório (Mesa, portas) -->
        <div id="office-layout">
            
            <div class="door-station">
                <div id="door-left" class="door-placeholder">PORTA ABERTA</div>
                <div class="controls">
                    <button id="btn-door-left" class="office-btn">FECHAR PORTA</button>
                    </div>
            </div>

            <div class="desk-placeholder">MESA DO GUARDA</div>

            <div class="door-station">
                <div id="door-right" class="door-placeholder">PORTA ABERTA</div>
                <div class="controls">
                    <button id="btn-door-right" class="office-btn">FECHAR PORTA</button>
                </div>
            </div>

        </div>

        <!-- A interface de usuário (UI) que fica por cima de tudo -->
        <div id="ui-layer">
            <div class="time-ui">
                <span id="clock">12:00 AM</span><br>
                <span id="night">Noite 1</span>
            </div>
            
            <div id="virus-alert" class="hidden">
                <p>⚠ ERROR: CAMERA FEED CORRUPTED ⚠</p>
                <button id="btn-open-terminal" class="office-btn" style="border-color: red; color: red;">OPEN TERMINAL</button>
            </div>

            <div class="battery-ui">
                Energia: <span id="power">100%</span>
            </div>

            <button id="btn-cameras" class="camera-toggle">ABRIR CÂMERAS</button>
        </div>

        <div id="camera-system" class="hidden">
            <div id="camera-view">
                <div class="static-overlay"></div> 
                <h3 id="camera-name">CAM 01 - PALCO PRINCIPAL</h3>
            </div>
            
            <div id="camera-map">
                <button class="cam-btn active-cam" data-cam="1">CAM 1</button>
                <button class="cam-btn" data-cam="2">CAM 2</button>
                <button class="cam-btn" data-cam="3">CAM 3</button>
                <button class="cam-btn" data-cam="4">CAM 4</button>
            </div>
        </div>
    </div>

    <div id="terminal-screen" class="screen hidden">
        
        <div class="scanlines"></div> 

        <div id="terminal-content">
            <h2 id="terminal-header">sys.admin@geometry-os:~$ <span class="blink">_</span></h2>
            
            <div id="terminal-body">
                <p>Iniciando modo de segurança...</p>
                <p>Aguardando conexão...</p>
            </div>

            <input type="text" id="terminal-input" class="hidden" placeholder="Digite o comando e aperte Enter..." autocomplete="off" spellcheck="false">
        </div>
    </div>    
    
    <script src="js/ai.js"></script>
    <script src="js/game.js"></script>
    <script src="js/main.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/minigame.js"></script>
</body>
</html>
